[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlocal"
version = "0.1.0"
description = "Local-first dictation: speech to clean text in any app, no cloud."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
full = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "silero-vad>=5.0",
    "pyperclip>=1.8",
]
dev = ["pytest>=7"]

[project.scripts]
flowlocal = "flowlocal.cli:main"

[tool.setuptools.packages.find]
include = ["flowlocal*"]
